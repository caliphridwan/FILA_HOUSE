services:
  - type: web
    name: fila-house
    runtime: node
    plan: free

    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_VERSION
        value: 20

      - key: DATABASE_URL
        sync: false

      - key: ADMIN_API_KEY
        sync: false

      - key: PAYSTACK_SECRET_KEY
        sync: false


      - key: RESEND_API_KEY
        sync: false