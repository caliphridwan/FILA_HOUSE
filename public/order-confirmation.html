<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order confirmation — Fila House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand-block"><span class="brand">Fila House</span></div>
    <a href="/" class="cart-btn" style="text-decoration:none;">Back to shop</a>
  </div>
</header>

<main style="max-width:560px;">
  <div id="content" style="margin-top:20px;">
    <div style="text-align:center; padding:40px 0;">
      <div class="spinner"></div>
      <p style="color:var(--ink-soft);">Confirming your payment...</p>
    </div>
  </div>
</main>

<script>
function naira(n){ return "₦" + Number(n).toLocaleString("en-NG"); }

async function confirm(){
  const params = new URLSearchParams(window.location.search);
  const reference = params.get("reference") || params.get("trxref");
  const content = document.getElementById("content");

  if(!reference){
    content.innerHTML = `<div class="receipt-box"><h2>No order reference found</h2><p>If you just paid, check your email for confirmation, or contact support.</p></div>`;
    return;
  }

  try {
    const res = await fetch(`/api/orders/verify/${encodeURIComponent(reference)}`);
    const order = await res.json();
    if(!res.ok) throw new Error(order.error || "Could not verify this order.");

    if(order.status !== "paid"){
      content.innerHTML = `
        <span class="error-badge">Payment not confirmed yet</span>
        <div class="receipt-box">
          <p>We haven't received confirmation for order <strong>${order.order_ref}</strong> yet. If you completed payment, this can take a few moments — refresh this page shortly.</p>
        </div>`;
      return;
    }

    content.innerHTML = `
      <span class="success-badge">✓ Payment confirmed</span>
      <div class="receipt-box">
        <div class="receipt-row" style="font-weight:700;"><span>Order ${order.order_ref}</span><span>${new Date(order.paid_at).toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"})}</span></div>
        <div style="margin:14px 0 10px;">
          ${order.items.map(i=>`<div class="receipt-line-item"><span>${i.cap_name} × ${i.qty}</span><span>${naira(i.line_total)}</span></div>`).join("")}
        </div>
        <div class="receipt-row"><span>Subtotal</span><span>${naira(order.subtotal)}</span></div>
        <div class="receipt-row"><span>Delivery (${order.zone_name})</span><span>${naira(order.delivery_fee)}</span></div>
        <div class="receipt-row" style="font-weight:700; border-top:1px dashed var(--line); padding-top:8px; margin-top:4px;"><span>Total paid</span><span>${naira(order.total)}</span></div>
        <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line);">
          <div class="receipt-row"><span>Deliver to</span><span>${order.customer_name}</span></div>
          <div class="receipt-row"><span>Phone</span><span>${order.phone}</span></div>
          <div class="receipt-row"><span>Address</span><span style="text-align:right; max-width:60%;">${order.address}</span></div>
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top:18px;">
        <button class="print-btn no-print" onclick="window.print()" style="flex:1;">Print / save receipt</button>
        <a href="/" class="primary-btn" style="flex:1; text-align:center; text-decoration:none; display:block; box-sizing:border-box; padding:12px 0;">Continue shopping</a>
      </div>`;
  } catch (err) {
    content.innerHTML = `<div class="receipt-box"><h2>Couldn't load this order</h2><p>${err.message}</p></div>`;
  }
}

confirm();
</script>
</body>
</html>
